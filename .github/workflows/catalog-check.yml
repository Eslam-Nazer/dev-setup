name: Catalog check

# Weekly: are all winget packages, npm packages and editor extensions still available
# and not deprecated? Opens (or comments on) an issue when something broke.
on:
  schedule:
    - cron: '17 5 * * 1'   # Mondays 05:17 UTC
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: env -DryRun
        id: env
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./env/setup-dev-env.ps1 -DryRun -Yes *>&1 | Tee-Object -FilePath env.log
          "code=$LASTEXITCODE" >> $env:GITHUB_OUTPUT
          exit 0

      - name: editor -DryRun
        id: editor
        shell: pwsh
        run: |
          ./editor/setup-dev-extensions.ps1 -DryRun -Target both -Yes -SkipEnvCheck *>&1 | Tee-Object -FilePath editor.log
          "code=$LASTEXITCODE" >> $env:GITHUB_OUTPUT
          exit 0

      - name: Report
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $envCode = [int]'${{ steps.env.outputs.code }}'
          $edCode  = [int]'${{ steps.editor.outputs.code }}'
          if ($envCode -ne 2 -and $edCode -eq 0) {
            if ($envCode -eq 3) { Write-Host '::warning::Some package lookups could not be checked' }
            Write-Host 'Catalog is healthy.'; exit 0
          }
          $fails = @(Select-String -Path env.log, editor.log -Pattern '\[FAIL\]|DEPRECATED' | ForEach-Object { $_.Line.Trim() })
          $body = "The weekly catalog check found packages or extensions that are missing or deprecated.`n`n" +
                  "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}`n`n" +
                  '```' + "`n" + ($fails -join "`n") + "`n" + '```' + "`n`nFix the ids in env/setup-dev-env.ps1 or editor/setup-dev-extensions.ps1."
          $title = 'Catalog check: missing or deprecated packages'
          $open = gh issue list -R '${{ github.repository }}' --state open --search "$title in:title" --json number --jq '.[0].number'
          if ($open) { gh issue comment $open -R '${{ github.repository }}' --body $body }
          else { gh issue create -R '${{ github.repository }}' --title $title --body $body }
          exit 1
