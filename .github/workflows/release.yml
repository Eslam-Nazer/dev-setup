name: Release

# Releases happen automatically: when a push to main carries a version
# ($ScriptVersion in the tool scripts) that has no GitHub Release yet,
# this workflow checks it, creates the tag vX.Y.Z and publishes the release.
# Pushing a tag vX.Y.Z by hand or running it manually works too.
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: ver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $versions = @{}
          Get-ChildItem -Recurse -Filter *.ps1 | Where-Object { $_.FullName -notmatch '[\\/](build|\.github)[\\/]' } | ForEach-Object {
            $m = Select-String -Path $_.FullName -Pattern "^\`$ScriptVersion\s*=\s*'([^']+)'" | Select-Object -First 1
            if ($m) { $versions[$_.Name] = $m.Matches[0].Groups[1].Value }
          }
          if ($versions.Count -eq 0) { Write-Host '::error::No $ScriptVersion found in any tool script'; exit 1 }
          $unique = @($versions.Values | Sort-Object -Unique)
          if ($unique.Count -gt 1) {
            $versions.GetEnumerator() | ForEach-Object { Write-Host "::error::$($_.Key) says $($_.Value)" }
            Write-Host '::error::Tool scripts disagree on the version; run build/bump-version.ps1'
            exit 1
          }
          $v = $unique[0]
          if ("${{ github.ref_type }}" -eq 'tag' -and "${{ github.ref_name }}".TrimStart('v') -ne $v) {
            Write-Host "::error::Tag ${{ github.ref_name }} does not match `$ScriptVersion $v"; exit 1
          }
          $tag = "v$v"
          gh release view $tag -R "${{ github.repository }}" *> $null
          $exists = $LASTEXITCODE -eq 0
          $global:LASTEXITCODE = 0
          if ($exists) { Write-Host "Release $tag already exists; nothing to do." } else { Write-Host "Will release $tag" }
          "version=$v"   >> $env:GITHUB_OUTPUT
          "tag=$tag"     >> $env:GITHUB_OUTPUT
          "skip=$($exists.ToString().ToLower())" >> $env:GITHUB_OUTPUT

      - name: Check CHANGELOG has this version
        if: steps.ver.outputs.skip != 'true'
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          if (-not (Select-String -Path CHANGELOG.md -Pattern "^## \[$([regex]::Escape($v))\]" -Quiet)) {
            Write-Host "::error::CHANGELOG.md has no '## [$v]' section"; exit 1
          }

      - name: Lint (PSScriptAnalyzer, errors only)
        if: steps.ver.outputs.skip != 'true'
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $issues = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error
          $issues | Format-Table -AutoSize
          if ($issues) { exit 1 }

      - name: Package tools
        if: steps.ver.outputs.skip != 'true'
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.tag }}'
          New-Item -ItemType Directory -Force dist | Out-Null
          # A tool = top-level folder that contains a .ps1 script
          $tools = Get-ChildItem -Directory | Where-Object {
            $_.Name -notin 'docs', 'build', '.github', 'dist' -and (Get-ChildItem $_.FullName -Filter *.ps1)
          }
          foreach ($t in $tools) {
            $stage = "dist/stage/dev-setup-$($t.Name)"
            New-Item -ItemType Directory -Force $stage | Out-Null
            Copy-Item "$($t.FullName)/*" $stage -Recurse
            if (Test-Path "docs/$($t.Name)") { Copy-Item "docs/$($t.Name)" "$stage/docs" -Recurse }
            Copy-Item README.md, CHANGELOG.md $stage
            if (Test-Path LICENSE) { Copy-Item LICENSE $stage }
            Compress-Archive -Path "$stage/*" -DestinationPath "dist/dev-setup-$($t.Name)-$v.zip"
            # Unversioned copies so .../releases/latest/download/<file> always works
            Get-ChildItem $t.FullName -File | Where-Object { $_.Extension -in '.ps1', '.bat' } | Copy-Item -Destination dist/
          }
          # One-command entry point at the repo root
          Copy-Item setup.ps1, setup.bat -Destination dist/
          # Checksums for everything people download (setup.ps1 verifies the tools with this file)
          Get-ChildItem dist -File | Where-Object { $_.Extension -in '.zip', '.ps1', '.bat' } | Sort-Object Name | ForEach-Object {
            "{0}  {1}" -f (Get-FileHash -Algorithm SHA256 $_.FullName).Hash.ToLower(), $_.Name
          } | Set-Content dist/SHA256SUMS.txt -Encoding ascii
          Get-Content dist/SHA256SUMS.txt
          Get-ChildItem dist -File | Format-Table Name, Length

      - name: Release notes from CHANGELOG
        if: steps.ver.outputs.skip != 'true'
        shell: pwsh
        run: |
          $v = '${{ steps.ver.outputs.version }}'
          $out = @(); $in = $false
          foreach ($l in Get-Content CHANGELOG.md) {
            if ($l -match '^## \[') {
              if ($in) { break }
              if ($l -match "^## \[$([regex]::Escape($v))\]") { $in = $true; continue }
            }
            if ($in) { $out += $l }
          }
          ($out -join "`n").Trim() | Set-Content dist/notes.md -Encoding utf8

      - name: Tag and publish GitHub Release
        if: steps.ver.outputs.skip != 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.ver.outputs.tag }}'
          $files = Get-ChildItem dist -File | Where-Object { $_.Extension -in '.zip', '.ps1', '.bat' -or $_.Name -eq 'SHA256SUMS.txt' } | ForEach-Object { $_.FullName }
          $extra = @()
          if ($tag -match '-') { $extra += '--prerelease' }
          # Creates the tag at this commit if it does not exist yet
          gh release create $tag @files --target "${{ github.sha }}" --title "dev-setup $tag" --notes-file dist/notes.md @extra
