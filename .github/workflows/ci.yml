name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Parse every PowerShell script
        shell: pwsh
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) {
              $failed = $true
              $errors | ForEach-Object { Write-Host "::error file=$($_.Extent.File),line=$($_.Extent.StartLineNumber)::$($_.Message)" }
            }
          }
          if ($failed) { exit 1 }

      - name: Parse with Windows PowerShell 5.1
        shell: powershell
        run: |
          $failed = $false
          Get-ChildItem -Recurse -Filter *.ps1 | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) { $failed = $true; $errors | ForEach-Object { Write-Host "$($_.Extent.File):$($_.Extent.StartLineNumber) $($_.Message)" } }
          }
          if ($failed) { exit 1 }

      - name: Lint (PSScriptAnalyzer, errors only)
        shell: pwsh
        run: |
          Install-Module PSScriptAnalyzer -Force -Scope CurrentUser
          $issues = Invoke-ScriptAnalyzer -Path . -Recurse -Severity Error
          $issues | Format-Table -AutoSize
          if ($issues) { exit 1 }

      - name: Version flag works
        shell: pwsh
        run: |
          Get-ChildItem -Directory | Where-Object { $_.Name -notin 'docs', 'build', '.github' } | ForEach-Object {
            Get-ChildItem $_.FullName -Filter *.ps1 | ForEach-Object {
              if (Select-String -Path $_.FullName -Pattern '\[switch\]\$Version' -Quiet) {
                $out = & $_.FullName -Version
                Write-Host "$($_.Name): $out"
                if ($out -notmatch '\d+\.\d+\.\d+') { Write-Host "::error::$($_.Name) -Version printed '$out'"; exit 1 }
              }
            }
          }

  smoke:
    # Real Windows: run the tools in modes that install nothing
    runs-on: windows-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: env -CheckOnly (detection on a real Windows machine)
        shell: pwsh
        run: |
          ./env/jahiz-env.ps1 -CheckOnly -Yes
          # 0 = PHP and Node present, 1 = something missing; anything else is a crash
          if ($LASTEXITCODE -notin 0, 1) { exit 1 }
          exit 0

      - name: env -DryRun (every winget / npm package still exists)
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./env/jahiz-env.ps1 -DryRun -Yes
          if ($LASTEXITCODE -eq 2) { exit 1 }
          if ($LASTEXITCODE -eq 3) { Write-Host '::warning::Some package lookups could not be checked' }
          exit 0

      - name: editor -DryRun (every extension exists and is not deprecated, both registries)
        shell: pwsh
        run: |
          ./editor/jahiz-editor.ps1 -DryRun -Target both -Yes -SkipEnvCheck
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: jahiz.ps1 -Version
        shell: pwsh
        run: ./jahiz.ps1 -Version
