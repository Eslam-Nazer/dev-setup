name: Bug report
description: Something went wrong while running a jahiz tool
labels: [bug]
body:
  - type: dropdown
    id: tool
    attributes:
      label: Which tool?
      options: [jahiz.ps1 (both), env (dev tools), editor (extensions + settings)]
    validations: { required: true }
  - type: input
    id: version
    attributes:
      label: Tool version
      description: Output of `.\jahiz.ps1 -Version` (or the tool's own `-Version`)
      placeholder: jahiz 0.3.0
    validations: { required: true }
  - type: input
    id: windows
    attributes:
      label: Windows and PowerShell version
      description: '`winver` and `$PSVersionTable.PSVersion`'
      placeholder: Windows 11 24H2, PowerShell 5.1.26100
    validations: { required: true }
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
      description: The step, the question you answered, and the error message
    validations: { required: true }
  - type: textarea
    id: log
    attributes:
      label: Log file
      description: Attach or paste the newest log from `%LOCALAPPDATA%\jahiz\` (env-*.log or install-*.log). It contains no passwords.
      render: text
